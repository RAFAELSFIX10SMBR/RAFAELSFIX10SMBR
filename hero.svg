<text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:0.0s;opacity:1">Exploring machine learning</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:2.4s;">Teaching machines to see</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:4.8s;">Building for the web</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:7.199999999999999s;">Making Android apps</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:9.6s;">Designing identities</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:12.0s;">Editing teaser videos</text><text class="ph" x="64" y="472" font-size="44" font-weight="800" letter-spacing="-2" fill="url(#gt)" style="animation-delay:14.399999999999999s;">Photographing events</text>
